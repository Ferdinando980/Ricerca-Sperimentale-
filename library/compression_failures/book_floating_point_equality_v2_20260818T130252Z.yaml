original_procedure_text: 'Symptom: Computed float comparison or membership check (`x
  in list_of_floats`) fails due to precision mismatch.

  Procedure:

  1. Locate exact comparisons (`==`, `!=`, `in`) on arithmetic-derived floats.

  2. Replace with tolerance checks: `abs(a - b) < epsilon` or `any(abs(a - b) < epsilon
  for b in values)`, using a domain-appropriate epsilon (e.g., 1e-9).

  3. Re-run tests; adjust epsilon if needed instead of reverting to exact comparison.'
