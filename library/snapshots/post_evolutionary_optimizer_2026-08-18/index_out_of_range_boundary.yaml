procedure_text: |
  Symptom: the last (or first) element of the input is silently dropped from the
  output, or the function raises an IndexError on otherwise-valid input.
  Procedure:
  1. Find every place an index or slice bound is computed relative to `len(...)`
     (`len(s) - 1`, `range(1, len(s))`, `hi = len(arr)`).
  2. Work out, for the smallest valid input, exactly which indices the algorithm
     needs to visit -- including the very first and very last element -- and
     compare that to what the current bound actually produces.
  3. A bound that is one element too conservative silently drops data at the
     edge; a bound that is one element too generous risks indexing past the end.
  4. Fix the specific `-1`/`+1` (or missing one) so the boundary matches what the
     algorithm needs, then re-run the tests including an edge-case input that
     exercises just the first/last element.
  Example (this Book's canonical case): run-length encoding's loop range was
  narrowed to `range(1, len(s) - 1)`, silently dropping the final run from the
  output.
