procedure_text: 'Symptom: Function returns correct results on first call but contaminated/accumulated
  results on subsequent calls.


  1. Inspect function signature for mutable default arguments (e.g., list, dict, set
  literals).

  2. Replace mutable default with `None`.

  3. Initialize container inside function body: `acc = [] if acc is None else acc`.

  4. Verify fix by calling function multiple times in one process.'
