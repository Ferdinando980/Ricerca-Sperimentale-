canonical_problem_id: is_leap_year
status: VERIFIED
confidence: 1.0
verification_count: 1
verification_types: [external]
procedure_text: |
  Symptom: a boolean-returning function is either far too strict (almost always
  returns False) or far too permissive (almost always returns True) compared to
  the spec.
  Procedure:
  1. Restate the spec in plain English as a conjunction/disjunction of conditions
     ("valid if A and B and C", or "leap year if (div-by-4 and not div-by-100) or
     div-by-400").
  2. Compare that plain-English structure, term by term and connective by
     connective, against the code's actual `and`/`or` placement -- a single
     swapped connective changes the truth table completely.
  3. Test against the specific edge cases the spec structure implies (e.g. for
     leap years: a century year divisible by 400 vs one that isn't).
  4. Fix by restoring the connective the spec requires; don't add extra
     conditions to compensate -- that usually masks the bug instead of fixing it.
  Example (this Book's canonical case): leap-year logic had its outer `or`
  changed to `and`, so a year had to satisfy both halves of the rule
  simultaneously -- which is never possible, so the function always returned
  False.
