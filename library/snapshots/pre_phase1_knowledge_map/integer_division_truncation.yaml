procedure_text: |
  Symptom: either (a) a result that should be a fraction comes out as a truncated
  integer, or (b) a `TypeError: list indices must be integers` / similar crash
  where a value computed by division is used as an index.
  Procedure:
  1. Find every `/` and `//` in the function.
  2. If the result feeds into indexing or slicing (`arr[x]`, `range(x)`), it must
     use `//` (integer division) -- Python will not silently coerce a float index.
  3. If the result is a numeric answer meant to be a true average/ratio, it must
     use `/` (true division) -- `//` silently drops the fractional part with no
     error, which is easy to miss without checking exact expected values.
  4. Fix by using the operator the value's downstream use requires, and re-run the
     tests -- pay attention to whether expected outputs in the test suite are
     integers or floats.
  Example (this Book's canonical case): a rolling average used `sum(chunk) //
  window` instead of `sum(chunk) / window`, silently truncating every average to
  an integer.
