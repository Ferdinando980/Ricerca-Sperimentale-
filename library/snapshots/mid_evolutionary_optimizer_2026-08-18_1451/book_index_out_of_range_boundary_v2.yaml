procedure_text: 'Symptom: Last/first element dropped or IndexError on valid input.


  1. Identify all `len(...)` based index/slice bounds.

  2. Verify range bounds against minimum valid input requirements, checking first
  and last elements.

  3. Adjust `-1`/`+1` offsets to match target indices.

  4. Re-test using edge cases exercising the first and last elements.'
