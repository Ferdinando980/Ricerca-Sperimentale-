procedure_text: 'Symptom: Boolean function too strict or permissive.

  1. Restate spec as logic (e.g., "A and (B or C)").

  2. Compare logic structure term-by-term against code connectors (`and`/`or`).

  3. Test edge cases derived from the spec structure.

  4. Correct the specific misplaced connector; do not add compensating logic.'
