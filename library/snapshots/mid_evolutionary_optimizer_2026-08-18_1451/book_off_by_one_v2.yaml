procedure_text: 'Symptom: Wrong/missing result at first or last element of a sequence;
  middle elements are correct.


  Procedure:

  1. Identify all loop bounds and index/length comparisons (e.g., `range(n)`, `lo
  <= hi`).

  2. Manually trace the smallest valid case (single/two-element) to see if the boundary
  element is processed.

  3. Replace `<`/`<=` or adjust `range` boundaries as needed.

  4. Correct to the required boundary-inclusive form and verify all tests pass.'
