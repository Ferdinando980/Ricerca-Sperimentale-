procedure_text: 'Symptom: First/last element dropped or IndexError on valid input.

  1. Locate bounds using len() (e.g., len(s)-1, range(1, len(s))).

  2. Trace smallest input: compare required vs. actual indices.

  3. Adjust +/-1 offsets.

  4. Test edge cases/single elements.'
