procedure_text: 'Symptom: Boolean logic mismatch vs spec.

  1. Map spec to logic (e.g., "A and (B or C)").

  2. Align term-by-term and connective-by-connective with code.

  3. Verify against edge cases.

  4. Fix connectives directly; avoid compensating conditions.'
