procedure_text: 'Symptom: Truncated integers where fractions are expected or TypeError
  (float index used).


  1. Identify all `/` and `//` operations in the function.

  2. If the result is used for indexing or slicing, use `//`.

  3. If the result represents a ratio or average, use `/`.

  4. Correct operators to match downstream requirements and verify against test suite
  integer/float expectations.'
