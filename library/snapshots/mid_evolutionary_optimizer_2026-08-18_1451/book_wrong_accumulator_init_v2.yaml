procedure_text: 'Symptom: Loop-based accumulation is off by a constant or contains
  a spurious initial element.


  1. Locate the accumulator initialization (e.g., `count=0`, `result=[]`) before the
  loop.

  2. Verify initialization matches loop logic (e.g., counters start at 0, lists at
  empty).

  3. Confirm signature by tracing a small input.

  4. Fix the initialization value to match loop assumptions rather than adjusting
  loop logic.'
