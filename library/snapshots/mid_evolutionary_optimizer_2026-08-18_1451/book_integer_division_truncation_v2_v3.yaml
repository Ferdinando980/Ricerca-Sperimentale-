procedure_text: 'Symptom: Truncated fractions or `TypeError: list indices must be
  integers`.

  1. Inspect all `/` and `//` operators.

  2. Use `//` for indexing or `range()`.

  3. Use `/` for ratios/averages to prevent truncation.

  4. Update operator, adjust tests, and re-run.'
