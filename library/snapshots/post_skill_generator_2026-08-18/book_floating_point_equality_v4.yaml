procedure_text: 'Symptom: Comparison or membership check (`==`, `!=`, `in`) fails
  for computed floats due to precision errors.


  1. Locate all arithmetic float comparisons.

  2. Replace with `abs(a - b) < epsilon` for scalars, or `any(abs(a - b) < epsilon
  for b in values)` for membership. Never use `min()` or `max()` for membership; they
  crash on empty sequences.

  3. Derive `epsilon` from your data’s precision (e.g., if data has 2 decimal places,
  use 0.01). Avoid arbitrary tiny values (1e-6) unless verifying exact arithmetic
  identities.

  4. If tests fail, distinguish between precision errors (adjust `epsilon`) and crashes
  (handle empty sequences/input edge cases).'
