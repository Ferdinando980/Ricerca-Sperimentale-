procedure_text: "Symptom: the function gives the right answer the first time it's\
  \ called in a\nprocess, but wrong (usually larger or contaminated) results on later\
  \ calls with\nfresh inputs, even though nothing global was touched.\nProcedure:\n\
  1. Check the function signature for a default argument that is a list, dict, or\n\
  \   set literal (`def f(x, acc=[])`, `def f(x, seen={})`).\n2. In Python, that default\
  \ object is created ONCE when the function is defined,\n   not once per call --\
  \ every call that doesn't pass its own value shares and\n   mutates the same object.\n\
  3. Fix by using `None` as the default and creating a fresh container inside the\n\
  \   function body: `def f(x, acc=None): acc = [] if acc is None else acc`.\n4. Re-run\
  \ the test suite calling the function multiple times in one process to\n   confirm\
  \ the state no longer leaks.\nExample (this Book's canonical case): `dedupe_preserve_order(items,\
  \ seen=set(),\nresult=[])` accumulated `seen`/`result` across every call instead\
  \ of starting\nfresh each time.\n"
