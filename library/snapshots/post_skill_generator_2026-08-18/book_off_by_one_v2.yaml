procedure_text: 'Symptom: Wrong/missing result at first or last element of a sequence.


  1. Locate all loop bounds/conditions (e.g., `range(n)`, `lo <= hi`).

  2. Manually trace the smallest valid input (1–2 elements); verify the boundary element
  executes.

  3. Replace `<`/`<=` or adjust `range` bounds.

  4. Restore correct boundary logic and verify with full test suite.'
