procedure_text: 'Symptom: an item exactly ON a boundary (equal to a limit, or identical to its neighbor) ends up on the wrong side of a branch -- the OPERATOR ITSELF (`<` vs `<=`, `==` vs `!=`) is swapped. No length or index arithmetic is involved at all -- do not touch loop ranges or index math here, only the operator.


  1. Find every comparison guarding a branch near the bug (a plain `if`/`while` test, not a loop range).

  2. Ask: should the EQUAL case take this branch or the other one? Check the spec/expected output for the boundary example.

  3. If equal should be included but isn''t (or vice versa): swap `<`<->`<=`, `>`<->`>=`, or `==`<->`!=`.

  4. Verify specifically with an input where two adjacent values are equal/touching -- that is where this bug hides.'
