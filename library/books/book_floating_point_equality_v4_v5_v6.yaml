procedure_text: "Symptom: Float comparisons (==, !=, in) fail due to precision.\n\n\
  1. Replace equality/membership checks with tolerance logic:\n   - Single: abs(a\
  \ - b) < epsilon\n   - Membership: any(abs(a - b) < epsilon for b in values)\n2.\
  \ Choosing epsilon -- follow this order, do not skip straight to a guess:\n   a.\
  \ An explicit tolerance/margin/percentage IS stated in the problem: use exactly\
  \ that, scaled to the values involved (e.g. \"within 2% of budget b\" means epsilon\
  \ = 0.02 * abs(b), not a fixed number).\n   b. No explicit tolerance, but a well-known,\
  \ scale-independent domain convention applies. Currently known: money/currency amounts\
  \ -- compare to the nearest cent, an ABSOLUTE tolerance of 0.01 in the currency's\
  \ major unit, regardless of the amount's size (do NOT scale this by magnitude --\
  \ a 10 unit invoice and a 10000 unit invoice both need cent precision, not a percentage\
  \ of the total).\n   c. Neither (a) nor (b) applies: do not invent a tolerance --\
  \ there is no reliable way to derive one from nothing, and a confident-looking number\
  \ here is no more trustworthy than any other guess. Default to a machine-precision\
  \ epsilon calculated from the float representation used in the context (the standard\
  \ machine epsilon for the data type, scaled by the magnitude of the inputs) rather\
  \ than a real-world-scale guess, and add a one-line code comment stating this is\
  \ a strict default because no tolerance or known convention was stated -- so a human\
  \ reviewing the diff can widen it if they know better, instead of silently trusting\
  \ an unverified number.\n3. Use any() over min()/max() to safely handle empty sequences.\n\
  4. On failure: if a true case is wrongly rejected and you used (a) or (b), recheck\
  \ the scaling/convention before touching anything else; if you used (c), that failure\
  \ itself is evidence a convention DOES exist for this domain -- state what you now\
  \ believe it is, do not just widen the number."
