procedure_text: 'Symptom: String equality/membership tests fail on case differences
  (e.g., "Tag" vs "tag").


  1. Explicitly check whether the domain logic semantically requires case-insensitive
  equality or membership rather than case-sensitive matching or handling other string
  mismatches like whitespace or Unicode normalization. If this condition does not
  hold, recognize that the method does not apply here and look for a different fix.

  2. Store normalized query: `q_norm = query.casefold()`.

  3. Normalize targets: `if target.casefold() == q_norm:`.

  4. For collections, transform elements or use a dictionary mapping (`{val.casefold():
  val}`) for lookups.

  5. Ensure returned values remain original (non-normalized) unless otherwise required.'
