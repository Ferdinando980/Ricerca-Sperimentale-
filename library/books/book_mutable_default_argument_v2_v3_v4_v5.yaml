procedure_text: "Symptom: Function returns accumulated results on subsequent calls.\n\
  \n1. Check for mutable default arguments.\n2. Determine replacement sentinel value:\n\
  \   - If the situation states an explicit sentinel or default value in the specification\
  \ or docstring, use exactly that.\n   - Else, if `None` is a valid domain input\
  \ distinct from \"not passed\" (observable signal: function logic checks `val is\
  \ None` as a meaningful value or `None` is an accepted payload), use a unique sentinel\
  \ instance `_SENTINEL = object()`.\n   - Else, do not guess: use `None` as the standard\
  \ Python language-level fallback sentinel for mutable defaults.\n3. Initialize:\
  \ val = [] if val is None else val.\n4. Verify with multi-call tests."
