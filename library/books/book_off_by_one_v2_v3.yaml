procedure_text: 'Symptom: the last valid iteration is skipped, or one extra unwanted
  iteration runs -- the loop/range runs the WRONG NUMBER OF TIMES (a trip-count bug),
  not a bad index value or a swapped operator.


  1. Find the loop bound: `while cond` or `range(...)`.

  2. Count by hand how many times it SHOULD run for a 1-2 element input, vs how many
  times the code actually runs.

  3. If short by one: loosen the bound (`<` -> `<=`, or drop a `-1` from a `range(n
  - 1)`/add `+1`).

  4. If one too many: tighten it the other way.

  5. Verify against a minimal-length input specifically -- trip-count bugs often only
  show up there, not on a full-length input.'
