procedure_text: 'Symptom: Wrong iteration count (loop runs too few/many times).


  1. Compare actual vs. expected iterations for 1-2 element inputs.

  2. Short by one: Loosen bound (e.g., `<` to `<=`, add `+1`).

  3. One too many: Tighten bound.

  4. Verify with minimal input.'
