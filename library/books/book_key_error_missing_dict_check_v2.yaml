procedure_text: "Symptom: KeyError during dictionary augmented assignment (e.g., `d[k]\
  \ += v` or `d[k].append(v)`) on uninitialized keys.\n\n1. Identify unsafe read-mutate\
  \ patterns.\n2. Determine default value (e.g., 0, [], \"\").\n3. Apply fixes:\n\
  \   - Scalar: `d[k] = d.get(k, default) + v`\n   - Collections: `d.setdefault(k,\
  \ []).append(v)`\n   - Alternative: Use `collections.defaultdict`."
