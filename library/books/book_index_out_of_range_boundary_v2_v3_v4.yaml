procedure_text: 'Symptom: IndexError or missing first/last element due to len()-derived
  index/slice bounds.


  1. Audit all len()-derived indices/bounds (e.g., arr[len(x)], range(1, len(s)-1)).

  2. Manually verify valid index range: max index is len-1, never len.

  3. If IndexError: bound reaches len (should be len-1).

  4. If missing edge: bound is off-by-one (starts at 1 or stops at len-1).

  5. Verify using first/last-element test cases.'
