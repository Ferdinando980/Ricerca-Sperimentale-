procedure_text: 'Symptom: Truncated integer results or "TypeError: list indices must
  be integers" during division-based indexing.


  1. Audit all `/` and `//` operators in the function.

  2. For indexing/slicing (e.g., `arr[x]`, `range(x)`): Ensure `//` is used.

  3. For ratios/averages: Ensure `/` is used.

  4. Correct operators based on downstream use and re-run tests, verifying expected
  numeric types.'
