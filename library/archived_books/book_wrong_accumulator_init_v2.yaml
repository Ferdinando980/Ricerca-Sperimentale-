procedure_text: "Symptom: Accumulation off by a constant (e.g., +1) or contains an\
  \ extra initial element.\n\n1. Locate accumulator initialization (e.g., `count =\
  \ 0`, `result = []`) before the loop.\n2. Verify initial value matches loop logic:\
  \ counters should start at 0, lists at empty. \n3. Confirm by tracing the first\
  \ iteration manually.\n4. Correct the initialization value; do not adjust loop logic."
