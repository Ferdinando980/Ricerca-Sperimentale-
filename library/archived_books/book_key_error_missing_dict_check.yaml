procedure_text: "Symptom: A KeyError is raised during dictionary access, particularly\
  \ on augmented assignment statements (e.g., `dict[key] += 1` or `dict[key].append(item)`)\
  \ when encountering an uninitialized key.\n\nProcedure:\n1. Scan dictionary updates\
  \ for patterns that read and mutate a key in a single step (`d[k] += ...`, `d[k]\
  \ = d[k] + ...`, `d[k].append(...)`) without a prior membership check or initialization.\n\
  2. Determine the expected fallback value for uninitialized keys (e.g., `0` for counts,\
  \ `[]` for lists, `\"\"` for strings).\n3. Replace unsafe subscript reads with a\
  \ safe retrieval method:\n   - For scalar accumulation: Change `d[k] += delta` to\
  \ `d[k] = d.get(k, default) + delta`.\n   - For in-place collection mutations: Change\
  \ `d[k].append(v)` to `d.setdefault(k, []).append(v)`.\n   - Alternatively, initialize\
  \ `d` as a `collections.defaultdict` if changing the container type is acceptable\
  \ in the function scope.\n4. Ensure the assignment target retains the original key\
  \ expression and type.\n\nExample: In `count_word_frequency`, `counts[w] += 1` raises\
  \ a KeyError on the first encounter of each word; it is fixed by replacing it with\
  \ `counts[w] = counts.get(w, 0) + 1`."
